<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-72.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-144.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-96.png" />
  
  <!-- Splash Screen配置 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mots" />
  
  <!-- Windows磁贴配置 -->
  <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
  <meta name="msapplication-square70x70logo" content="/icons/icon-72.png" />
  <meta name="msapplication-square150x150logo" content="/icons/icon-144.png" />
  <meta name="msapplication-wide310x150logo" content="/icons/icon-192.png" />
  <meta name="msapplication-square310x310logo" content="/icons/icon-192.png" />
  
  <!-- 社交媒体优化 -->
  <meta property="og:title" content="Mots - 初中生法语词汇学习助手" />
  <meta property="og:description" content="专为初中生设计的法语词汇学习应用" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <meta property="og:url" content="/" />
  
  <!-- 禁用缩放和选择 -->
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- 预加载关键资源 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <style>
    /* 启动画面样式 */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url(/icons/logo01.png);
      background-size: 250px 250px;
      background-repeat: repeat;
      background-position: 0 0;
      background-blend-mode: soft-light;
      background-color: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      overflow: hidden;
    }
    
    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    
    .splash-icon {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #C8E6C9 0%, #FFFFFF 25%, #FFB74D 50%, #FFFFFF 75%, #C8E6C9 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: logoPulse 2s infinite;
      box-shadow: 0 8px 32px rgba(46, 139, 111, 0.3);
      position: relative;
      z-index: 2;
    }
    

    
    .splash-icon img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }
    
    .splash-text {
      color: #2E8B6F;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(46, 139, 111, 0.3);
      position: relative;
      z-index: 2;
    }
    
    .splash-subtitle {
      color: #1F4F3D;
      font-size: 18px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    
    @keyframes logoPulse {
      0% { 
        transform: scale(1) rotate(0deg);
        box-shadow: 0 8px 32px rgba(46, 139, 111, 0.3);
      }
      50% { 
        transform: scale(1.1) rotate(180deg);
        box-shadow: 0 12px 40px rgba(46, 139, 111, 0.6);
      }
      100% { 
        transform: scale(1) rotate(360deg);
        box-shadow: 0 8px 32px rgba(46, 139, 111, 0.3);
      }
    }
    
    @keyframes logoBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes textGlow {
      0% { 
        text-shadow: 0 2px 10px rgba(46, 139, 111, 0.3);
        transform: scale(1);
      }
      100% { 
        text-shadow: 0 4px 20px rgba(46, 139, 111, 0.6);
        transform: scale(1.05);
      }
    }
    
    /* 防止页面闪烁 */
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }
    
    /* 只在启动画面显示时禁用滚动 */
    body:not(.app-ready) {
      overflow: hidden;
    }
    
    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <!-- 启动画面 -->
  <div id="splash-screen">
    <!-- 主内容 -->
    <div class="splash-icon">
      <img src="/icons/icon-192.png" alt="Mots" width="120" height="120" />
    </div>
    <div class="splash-text">Mots</div>
    <div class="splash-subtitle">初中生法语词汇学习助手</div>
    <div class="splash-subtitle" style="margin-top: 8px; font-size: 14px; color: #6F8F83;">开启你的法语学习之旅</div>
  </div>
  
  <div id="root"></div>
  
  <!-- PWA安装提示 -->
  <div id="install-prompt" style="display: none; position: fixed; bottom: 20px; left: 20px; right: 20px; background: #26C6B0; color: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 1000;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-weight: 600; margin-bottom: 4px;">安装应用</div>
        <div style="font-size: 14px; opacity: 0.9;">添加到主屏幕，获得更好体验</div>
      </div>
      <div>
        <button id="install-button" style="background: white; color: #26C6B0; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; margin-right: 8px;">安装</button>
        <button id="close-install" style="background: transparent; color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px;">关闭</button>
      </div>
    </div>
  </div>
  
  <!-- PWA状态提示 -->
  <div id="pwa-status" style="display: none; position: fixed; top: 20px; left: 20px; right: 20px; background: #F59E0B; color: white; padding: 12px; border-radius: 8px; text-align: center; z-index: 1000;">
    <span id="pwa-status-text"></span>
  </div>
  
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Service Worker注册 -->
  <script>
    // 启动画面初始化函数
    function initSplashScreen() {
      // 这里可以添加其他启动相关的初始化逻辑
      console.log('Mots 应用启动中...');
    }
    
    // Service Worker 注册和版本管理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // 注册Service Worker，并传递构建版本信息
          const registration = await navigator.serviceWorker.register('/sw.js', {
            updateViaCache: 'none' // 禁用缓存更新
          });
          console.log('[PWA] Service Worker registered successfully:', registration.scope);
          
          // 监听Service Worker更新
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] New Service Worker installed');
                  showUpdateNotification();
                }
              });
            }
          });
          
          // 监听来自Service Worker的自动刷新消息
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'FORCE_REFRESH') {
              console.log('[PWA] Force refresh message received');
              // 延迟1秒后自动刷新，给用户一个平滑的过渡
              setTimeout(() => {
                console.log('[PWA] 自动刷新页面获取新版本');
                window.location.reload();
              }, 1000);
            }
          });
          
          // 定期检查更新（每30分钟）
          setInterval(() => {
            if (registration.active) {
              registration.active.postMessage({ type: 'CHECK_FOR_UPDATES' });
            }
          }, 30 * 60 * 1000);
          
        } catch (error) {
          console.error('[PWA] Service Worker registration failed:', error);
        }
      });
    }
    
    // PWA安装提示
    let deferredPrompt;
    let installPrompt = document.getElementById('install-prompt');
    let installButton = document.getElementById('install-button');
    let closeInstall = document.getElementById('close-install');
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // 延迟显示安装提示（让用户先熟悉应用）
      setTimeout(() => {
        if (!window.matchMedia('(display-mode: standalone)').matches && !localStorage.getItem('pwa-installed')) {
          installPrompt.style.display = 'block';
        }
      }, 30000); // 30秒后显示
    });
    
    // 安装按钮事件
    installButton?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
          console.log('[PWA] User accepted the install prompt');
          localStorage.setItem('pwa-installed', 'true');
          showPWAStatus('应用安装成功！', 'success');
        }
        
        deferredPrompt = null;
        installPrompt.style.display = 'none';
      }
    });
    
    // 关闭安装提示
    closeInstall?.addEventListener('click', () => {
      installPrompt.style.display = 'none';
      localStorage.setItem('pwa-install-dismissed', Date.now());
    });
    
    // 检查是否已安装
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App was installed');
      localStorage.setItem('pwa-installed', 'true');
      installPrompt.style.display = 'none';
      showPWAStatus('应用安装成功！', 'success');
    });
    
    // PWA状态提示函数
    function showPWAStatus(message, type = 'info') {
      const statusElement = document.getElementById('pwa-status');
      const textElement = document.getElementById('pwa-status-text');
      
      textElement.textContent = message;
      statusElement.style.display = 'block';
      
      // 根据类型设置颜色
      if (type === 'success') {
        statusElement.style.background = '#22C55E';
      } else if (type === 'warning') {
        statusElement.style.background = '#F59E0B';
      } else if (type === 'error') {
        statusElement.style.background = '#EF4444';
      }
      
      // 3秒后自动隐藏
      setTimeout(() => {
        statusElement.style.display = 'none';
      }, 3000);
    }
    

    
    // 检查网络状态
    function updateOnlineStatus() {
      if (navigator.onLine) {
        showPWAStatus('网络连接已恢复', 'success');
      } else {
        showPWAStatus('网络连接断开，应用将在离线模式下工作', 'warning');
      }
    }
    
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // 初始化启动画面
    let splashTimeout;
    
    function hideSplashScreen() {
      const splashScreen = document.getElementById('splash-screen');
      if (splashScreen) {
        splashScreen.classList.add('hidden');
        
        // 立即恢复页面滚动能力
        document.body.classList.add('app-ready');
        
        setTimeout(() => {
          // 完全移除启动画面，确保不影响页面滚动
          splashScreen.style.display = 'none';
          splashScreen.remove(); // 从DOM中完全移除
        }, 500);
      }
      // 清除定时器
      if (splashTimeout) {
        clearTimeout(splashTimeout);
      }
    }
    
    // 初始化启动画面
    initSplashScreen();
    
    // 设置5秒自动隐藏
    splashTimeout = setTimeout(() => {
      hideSplashScreen();
    }, 5000);
    
    // 添加触屏点击事件，点击后立即进入
    document.addEventListener('click', hideSplashScreen, { once: true });
    document.addEventListener('touchstart', hideSplashScreen, { once: true });
    
    // 防止双击缩放 - 只在按钮等可点击元素上阻止
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        // 只在点击可交互元素时阻止双击缩放
        const target = event.target;
        if (target.tagName === 'BUTTON' || target.closest('button') || 
            target.tagName === 'A' || target.closest('a') ||
            target.tagName === 'INPUT' || target.closest('input')) {
          event.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, false);
    
    // 添加触摸反馈
    document.addEventListener('touchstart', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        const button = e.target.tagName === 'BUTTON' ? e.target : e.target.closest('button');
        button.style.transform = 'scale(0.95)';
        button.style.transition = 'transform 0.1s ease';
      }
    });
    
    document.addEventListener('touchend', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
        const button = e.target.tagName === 'BUTTON' ? e.target : e.target.closest('button');
        setTimeout(() => {
          button.style.transform = 'scale(1)';
        }, 100);
      }
    });
  </script>
</body>

</html>
