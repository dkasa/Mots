version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    container_name: mots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mots
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - mots-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mots"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "2402:2402"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3001
      - TZ=Asia/Shanghai
    networks:
      - mots-network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:2402
      # PostgreSQL 配置
      - USE_POSTGRES=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mots
      - DB_USER=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=mots-super-secret-jwt-key-2024-production-ready
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data  # 保留词汇数据文件
    networks:
      - mots-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mots-network:
    driver: bridge